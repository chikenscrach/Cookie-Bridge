name: Publish Cookie Bridge v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: 283815b2a3ad7f8b31567d0a4904b78f425a1a3d

      - name: Build extension ZIP
        run: |
          mkdir -p dist/cookie-bridge
          cp manifest.json background.js browser-context.mjs cookie-api.mjs core.mjs manager.html manager.css manager.mjs dist/cookie-bridge/
          cp -R icons dist/cookie-bridge/icons
          (
            cd dist
            zip -r cookie-bridge-v1.1.0.zip cookie-bridge
          )

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Cookie Bridge v1.1.0

          新增一般與無痕 / InPrivate 視窗支援。

          ### 主要更新

          - Manifest 改用 `incognito: "split"`；需由使用者在瀏覽器詳細資料啟用無痕權限。
          - 管理分頁固定開在點選工具列圖示的視窗。
          - 依管理分頁 Tab ID 與 `getAllCookieStores()` 對應目前 Cookie 儲存區。
          - 匯入、衝突判定、讀回確認，以及未分割／分割 Cookie 匯出都明確指定目的 `storeId`。
          - 無法確認視窗或 Cookie 儲存區時停止操作，不猜測 store ID，也不退回預設儲存區。
          - 畫面會標示一般／無痕模式，備份檔名區分 `regular` / `incognito`。
          - 來源檔中的 `storeId` 不會直接套用到目的環境；跨模式搬移請使用匯出再匯入。
          - 新增 17 項無痕／儲存區自動化測試，目前共 47 項測試通過。

          ### 安裝

          下載本 Release 的 `cookie-bridge-v1.1.0.zip` 並解壓縮，然後在 Chrome / Edge 的擴充功能頁面開啟開發人員模式，選擇「載入未封裝項目」，指定解壓後內含 `manifest.json` 的 `cookie-bridge` 資料夾。

          Chrome / Edge 最低版本：130。

          ### 注意

          目前已完成自動化測試，但尚未宣稱 Chrome / Edge 真實瀏覽器上的所有 Cookie API、無痕 split、權限提示與登入狀態恢復都已完成實機驗證。

          Cookie 備份檔包含明文 Cookie 值，請視同密碼或 Session 憑證妥善保管。
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            dist/cookie-bridge-v1.1.0.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target 283815b2a3ad7f8b31567d0a4904b78f425a1a3d \
            --title "Cookie Bridge v1.1.0" \
            --notes-file /tmp/release-notes.md \
            --latest
